<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0704" />
    <title>Private Kitchen — Cooperative Cooking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0c0704;
        color: #f5e6c8;
        font-family: system-ui, sans-serif;
        gap: 1.5rem;
        z-index: 9999;
      }
      #app-loading p {
        margin: 0;
        font-size: 1rem;
        opacity: 0.7;
        letter-spacing: 0.05em;
      }
      #app-loading-spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 3px solid rgba(245, 230, 200, 0.2);
        border-top-color: #f5e6c8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-loading-spinner { animation: none; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="app-loading" aria-live="polite" aria-label="Loading">
      <div id="app-loading-spinner" aria-hidden="true"></div>
      <p>Private Kitchen is loading&hellip;</p>
    </div>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
